[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sudoku_ns"
version = "0.1.0"
description = "Neurosymbolic Sudoku solver: CNN beliefs + weighted MaxSAT (AID 851 course project)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "python-sat>=1.8.dev0",
    "pillow>=10.0",
    "matplotlib>=3.7",
    "tqdm>=4.65",
]

[project.optional-dependencies]
ml = ["torch>=2.1", "torchvision>=0.16"]
dev = ["pytest>=7.4", "ruff>=0.5", "pre-commit>=3.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running tests (skipped in CI)"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
